# Foundry configuration. Implementations depend on forge-std and
# OpenZeppelin 4.9.6 (the last line supporting solc 0.8.19): run
# `npm run setup --workspace=bel-contracts` once before `forge build`.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes deployments/<network>.json for the backend adapter.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./broadcast" },
]
# Turn warnings into errors once implementations land:
# deny = ["warnings"]

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[lint]
# `1 << role` bitmasks are intentional (incorrect-shift is a false positive);
# the rest are style/gas suggestions reviewed as intentional (uint64 timestamps,
# fail-fast loops, audit txId already emitted as an event, _mint to vetted wallets).
exclude_lints = ["incorrect-shift", "asm-keccak256", "screaming-snake-case-immutable", "unsafe-typecast", "require-revert-in-loop", "unused-return", "unsafe-oz-erc721-mint"]
