# Foundry configuration. `forge build` and `forge test` work with no
# further setup — the current sources are interfaces plus a dependency-
# free test skeleton. Run `npm run setup --workspace=bel-contracts` when
# you need forge-std assertions/cheatcodes.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 200
# Turn warnings into errors once implementations land:
# deny = ["warnings"]

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
