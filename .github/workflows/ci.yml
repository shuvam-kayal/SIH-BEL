# Phase 10 merge gate. A pull request cannot merge unless every job here
# is green. Keep the jobs independent so one team member's red build
# doesn't block an unrelated module's PR.

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  typescript:
    name: Typecheck and test (shared, backend, frontend, mocks)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bel:bel@localhost:5432/bel
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bel
          POSTGRES_PASSWORD: bel
          POSTGRES_DB: bel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bel -d bel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test --workspace=bel-backend
      - name: Run PostgreSQL persistence integration tests
        run: npm run test:integration
        env:
          BEL_RUN_INTEGRATION: "true"
      - run: npm test --workspace=bel-frontend --if-present
      - run: npm run build --workspace=bel-frontend

  evm-integration:
    name: Backend EVM integration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bel:bel@localhost:5432/bel
      BEL_RUN_INTEGRATION: "true"
      BEL_EVM_RPC_URL: http://127.0.0.1:8545
      BEL_CHAIN_RPC_URL: http://127.0.0.1:8545
      BEL_EXECUTION_PROFILE: prototype
      BEL_BOOTSTRAP_VALIDATOR_COUNT: "4"
      # Public deterministic Anvil accounts 1-4; account 0 is the bootstrap admin.
      BEL_BOOTSTRAP_VALIDATOR_0: 0x70997970C51812dc3A010C7d01b50e0d17dc79C8
      BEL_BOOTSTRAP_VALIDATOR_1: 0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC
      BEL_BOOTSTRAP_VALIDATOR_2: 0x90F79bf6EB2c4f870365E785982E1f101E93b906
      BEL_BOOTSTRAP_VALIDATOR_3: 0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bel
          POSTGRES_PASSWORD: bel
          POSTGRES_DB: bel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bel -d bel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Start Anvil Docker service
        run: |
          set -euo pipefail
          docker run -d --name bel-anvil -p 8545:8545 --entrypoint anvil ghcr.io/foundry-rs/foundry:latest --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 10000
          for i in {1..30}; do
            if cast rpc --rpc-url http://127.0.0.1:8545 eth_chainId; then
              exit 0
            fi
            sleep 1
          done
          echo "Anvil did not become ready within 30 seconds" >&2
          exit 1
      - name: Start IPFS Docker service
        run: |
          set -euo pipefail
          docker run -d --name bel-ipfs -p 5001:5001 ipfs/kubo:v0.30.0
          for i in {1..30}; do
            if curl --fail --silent --show-error -X POST http://127.0.0.1:5001/api/v0/id >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "IPFS did not become ready within 30 seconds" >&2
          exit 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Configure deterministic prototype validators
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const { HDNodeWallet } = require("ethers");
          const mnemonic = "test test test test test test test test test test test junk";
          for (let i = 0; i < 4; i++) {
            const wallet = HDNodeWallet.fromPhrase(mnemonic, undefined, "m/44'/60'/0'/0/" + i);
            console.log("BEL_BOOTSTRAP_VALIDATOR_" + i + "=" + wallet.address);
          }
          NODE
      - name: Install pinned Solidity dependencies
        run: bash scripts/setup-contracts.sh
      - run: forge build
        working-directory: contracts
      - run: npm run prisma:generate
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Prepare Foundry runtime directories
        run: mkdir -p contracts/deployments contracts/broadcast
      - run: npm run test:evm
      - name: Run Person 1 EVM/PostgreSQL integration
        run: npx vitest run backend/test/users.evm.integration.test.ts --testTimeout=120000
      - name: Run complete cross-person E2E workflow
        run: npm run test:e2e:workflow
        env:
          IPFS_API_URL: http://127.0.0.1:5001

  contracts:
    name: Build and test contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Solidity dependencies
        run: bash scripts/setup-contracts.sh
      - run: forge build
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts
      - name: Check formatting
        run: forge fmt --check
        working-directory: contracts
        continue-on-error: true

  consensus:
    name: Consensus simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r blockchain/requirements.txt
      - run: python -m pytest blockchain/tests -q

  specs:
    name: Specification documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: API_SPEC.yaml must stay parseable
        run: python -c "import yaml,sys; yaml.safe_load(open('docs/API_SPEC.yaml')); print('API_SPEC.yaml OK')"
      - name: The six frozen documents must exist
        run: |
          for f in SYSTEM_SPEC RBAC_MATRIX DATA_MODEL CONTRACT_SPEC CONSENSUS_SPEC ARCHITECTURE BASELINE_FREEZE; do
            test -f "docs/$f.md" || { echo "Missing docs/$f.md"; exit 1; }
          done
          echo "All frozen documents present."
