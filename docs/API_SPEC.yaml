openapi: 3.0.0
info:
  title: BEL Platform API
  version: 1.0.0
  description: Frozen REST contract for base-v1. Frontend and backend use shared/api.ts
    for compile-time shapes.
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, NOT_IMPLEMENTED, INTERNAL_ERROR]
        message:
          type: string
    Role:
      type: string
      enum:
      - ADMIN
      - MANAGER
      - ENGINEER
      - TECHNICIAN
      - AUDITOR
      - ISSUER
      - VERIFIER
    User:
      type: object
      required:
      - employeeId
      - identityId
      - walletAddress
      - role
      - department
      - status
      properties:
        employeeId:
          type: string
        identityId:
          type: string
        walletAddress:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        department:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REVOKED
    Identity:
      type: object
      required:
      - identityId
      - employeeId
      - fullName
      - role
      - department
      - status
      - createdAt
      properties:
        identityId:
          type: string
        employeeId:
          type: string
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        department:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REVOKED
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        verifiedBy:
          type: string
          nullable: true
    Wallet:
      type: object
      required:
      - address
      - identityId
      - deviceId
      - status
      - activatedAt
      - revokedAt
      - revokedReason
      properties:
        address:
          type: string
        identityId:
          type: string
        deviceId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REVOKED
        activatedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedReason:
          type: string
          nullable: true
        publicKey:
          type: string
          nullable: true
          description: Public key generated by the device-side wallet. Never a private key.
    Asset:
      type: object
      required:
      - assetId
      - nftId
      - assetType
      - ownerId
      - custodianId
      - parentAssetId
      - status
      properties:
        assetId:
          type: string
        nftId:
          type: string
        assetType:
          type: string
        ownerId:
          type: string
        custodianId:
          type: string
        parentAssetId:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - IN_MAINTENANCE
          - DECOMMISSIONED
    Job:
      type: object
      required:
      - jobId
      - assetId
      - createdBy
      - assignedTo
      - verifierId
      - status
      - priority
      - createdAt
      - completedAt
      properties:
        jobId:
          type: string
        assetId:
          type: string
        createdBy:
          type: string
        assignedTo:
          type: string
        verifierId:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - CREATED
          - ASSIGNED
          - IN_PROGRESS
          - COMPLETED
          - VERIFIED
          - REJECTED
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    AuditEvent:
      type: object
      required:
      - eventId
      - txId
      - entityType
      - entityId
      - action
      - actorIdentityId
      - timestamp
      properties:
        eventId:
          type: string
        txId:
          type: string
        entityType:
          type: string
          enum:
          - ASSET
          - JOB
          - IDENTITY
          - WALLET
        entityId:
          type: string
        action:
          type: string
        actorIdentityId:
          type: string
        timestamp:
          type: string
          format: date-time
    Validator:
      type: object
      required:
      - validatorId
      - publicKey
      - status
      - joinedAt
      properties:
        validatorId:
          type: string
        publicKey:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SLASHED
        joinedAt:
          type: string
          format: date-time
    BlockchainStatus:
      type: object
      required:
      - height
      - healthy
      - finalityLag
      - lastFinalizedHeight
      properties:
        height:
          type: integer
        healthy:
          type: boolean
        finalityLag:
          type: integer
        lastFinalizedHeight:
          type: integer
    Session:
      type: object
      required:
      - user
      - token
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
    Device:
      type: object
      required:
      - deviceId
      - identityId
      - status
      - registeredAt
      - revokedAt
      properties:
        deviceId:
          type: string
        identityId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REVOKED
        registeredAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        publicKey:
          type: string
          description: Public key generated by the device-side wallet component. Never a private key.
        metadata:
          type: object
          additionalProperties: true
    ProvisioningChallenge:
      type: object
      required: [challengeId, deviceId, challenge, purpose, expiresAt, usedAt]
      properties:
        challengeId: { type: string }
        deviceId: { type: string }
        challenge: { type: string }
        purpose: { type: string, enum: [WALLET_INITIALIZATION, AUTHENTICATION, FRESH_AUTHENTICATION] }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    PendingRegistration:
      type: object
      required: [identity, device, wallet]
      properties:
        identity: { $ref: '#/components/schemas/PendingIdentity' }
        device: { $ref: '#/components/schemas/Device' }
        wallet: { $ref: '#/components/schemas/Wallet' }
    PendingIdentity:
      type: object
      required: [identityId, fullName, status, createdAt]
      properties:
        identityId: { type: string }
        employeeId: { type: string, nullable: true }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role', nullable: true }
        department: { type: string, nullable: true }
        status: { type: string, enum: [PENDING] }
        createdAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time, nullable: true }
        verifiedBy: { type: string, nullable: true }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
paths:
  /auth/provisioning-challenge:
    post:
      summary: Create a short-lived device-bound account initialization challenge
      description: The device must be BEL-managed and on the BEL internal network or approved VPN. No private key is sent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, deviceMetadata]
              properties:
                deviceId: { type: string }
                deviceMetadata:
                  type: object
                  additionalProperties: true
                  description: Non-secret device/network evidence, not a sole security identity.
      responses:
        '201':
          description: Challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningChallenge' }
  /auth/initialize-account:
    post:
      summary: Initialize a pending employee account
      description: The device generates and retains the private key locally. Only the public key/address and a challenge signature are submitted; the backend never receives, stores, returns, or logs private-key material.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, deviceId, publicKey, walletAddress, challengeId, signature, deviceMetadata]
              properties:
                fullName: { type: string }
                employeeId: { type: string, nullable: true }
                department: { type: string, nullable: true }
                deviceId: { type: string }
                publicKey: { type: string, description: Public key only; never include privateKey. }
                walletAddress: { type: string }
                challengeId: { type: string }
                signature: { type: string }
                deviceMetadata: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Pending registration created; it is not an authenticated active employee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingRegistration' }
  /auth/login:
    post:
      summary: Login from a managed BEL workstation
      security: []
      description: The human action is only Click Sign In. The managed-device wallet component handles the challenge, local signature, public key, and proof fields automatically. A legacy device credential is development-only and disabled in production. Private keys never cross the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: DevelopmentLegacyLogin
                  type: object
                  required: [deviceCredential]
                  additionalProperties: false
                  description: Development/compatibility-only credential login; disabled in production.
                  properties:
                    deviceCredential: { type: string }
                - title: DeviceProofLogin
                  type: object
                  required: [deviceId, challengeId, publicKey, signature]
                  additionalProperties: false
                  description: Production login proof. The managed device obtains the challenge and signs locally; private keys never cross the API.
                  properties:
                    deviceId: { type: string }
                    challengeId: { type: string }
                    publicKey: { type: string, description: Public key only; never include privateKey. }
                    signature: { type: string }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /auth/login-challenge:
    post:
      summary: Create a short-lived challenge for device-signature login (handled automatically by the device wallet)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '201':
          description: Authentication challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningChallenge' }
  /auth/fresh-challenge:
    post:
      summary: Create a short-lived proof challenge for a configured high-impact operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation: { type: string }
                resourceId: { type: string }
      responses:
        '201':
          description: Fresh-authentication challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningChallenge' }
  /admin/users:
    post:
      summary: Development/compatibility-only legacy administrator seed path (disabled in production; does not create a wallet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - employeeId
              - fullName
              - role
              - department
              properties:
                employeeId:
                  type: string
                fullName:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
                department:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - identity
                - user
                properties:
                  identity:
                    $ref: '#/components/schemas/Identity'
                  user:
                    $ref: '#/components/schemas/User'
  /admin/users/{id}/revoke-wallet:
    post:
      summary: Revoke wallet
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Wallet revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - wallet
                properties:
                  wallet:
                    $ref: '#/components/schemas/Wallet'
  /admin/users/{id}/activate-wallet:
    post:
      summary: Activate an already registered device-generated wallet
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - deviceId
              - walletAddress
              properties:
                deviceId:
                  type: string
                walletAddress:
                  type: string
                  description: Existing public wallet address generated by the device-side wallet component. The backend never generates this value.
      responses:
        '200':
          description: Wallet activated
          content:
            application/json:
              schema:
                type: object
                required:
                - wallet
                properties:
                  wallet:
                    $ref: '#/components/schemas/Wallet'
  /admin/registrations/pending:
    get:
      summary: List pending employee registrations
      responses:
        '200':
          description: Pending registrations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingRegistration' }
  /admin/users/{id}/verify:
    post:
      summary: Verify a pending employee and assign employee ID/department
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, department]
              properties:
                employeeId: { type: string }
                department: { type: string }
      responses:
        '200':
          description: Verified but still pending role/device/wallet activation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
  /admin/users/{id}/activate:
    post:
      summary: Activate a verified pending identity, device, and wallet
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Active registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingRegistration' }
  /users/me:
    get:
      summary: Current user
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    get:
      summary: User by employee id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /assets:
    get:
      responses:
        '200':
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assetType
              - ownerId
              - custodianId
              properties:
                assetId:
                  type: string
                assetType:
                  type: string
                ownerId:
                  type: string
                custodianId:
                  type: string
                parentAssetId:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
  /assets/{id}:
    get:
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
  /assets/{id}/transfer:
    post:
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - newOwnerId
              properties:
                newOwnerId:
                  type: string
                newCustodianId:
                  type: string
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
  /jobs:
    get:
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assetId
              - priority
              properties:
                assetId:
                  type: string
                priority:
                  type: string
                  enum:
                  - LOW
                  - MEDIUM
                  - HIGH
                  - CRITICAL
                verifierId:
                  type: string
      responses:
        '201':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{id}/assign:
    post:
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - technicianId
              properties:
                technicianId:
                  type: string
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{id}/start:
    post:
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{id}/complete:
    post:
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - evidenceHash
              properties:
                evidenceHash:
                  type: string
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{id}/approve:
    post:
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{id}/reject:
    post:
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /audit/assets/{id}:
    get:
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Audit list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
  /blockchain/status:
    get:
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockchainStatus'
  /blockchain/validators:
    get:
      responses:
        '200':
          description: Validators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Validator'
  /blockchain/committee/{height}:
    get:
      parameters:
      - name: height
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Committee
          content:
            application/json:
              schema:
                type: object
                required:
                - height
                - validatorIds
                properties:
                  height:
                    type: integer
                  validatorIds:
                    type: array
                    items:
                      type: string
  /jobs/{id}:
    get:
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      summary: Revoke the current bearer session
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Session revoked
  /admin/users/{id}/devices:
    post:
      summary: Register a managed device for an identity
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                credential: { type: string, description: Legacy managed-device credential; never a private key. }
                publicKey: { type: string, description: Public key generated by the device-side component. }
      responses:
        '201':
          description: Registered device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
    get:
      summary: List managed devices for an identity
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Managed devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
  /admin/devices/{deviceId}/revoke:
    post:
      summary: Revoke a managed device and its active wallet
      parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string }
      responses:
        '200':
          description: Revoked device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
  /admin/users/{id}/wallets:
    post:
      summary: Register a pending wallet for an identity
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, walletAddress]
              properties:
                deviceId: { type: string }
                walletAddress: { type: string, description: Device-generated public address; never generated by the backend. }
      responses:
        '201':
          description: Pending wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
    get:
      summary: List wallets for an identity
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Wallet history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Wallet' }
  /admin/users/{id}/role:
    post:
      summary: Assign or change an identity role
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated user role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /admin/users/{id}/grants:
    post:
      summary: Create an AUTH authorization grant
    get:
      summary: List authorization grants
  /admin/users/{id}/grants/{grantId}/revoke:
    post:
      summary: Revoke an authorization grant
