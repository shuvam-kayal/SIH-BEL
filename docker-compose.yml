services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bel
      POSTGRES_PASSWORD: bel
      POSTGRES_DB: bel
    ports:
      - "5432:5432"
    volumes:
      - bel-postgres:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./shared:/app/shared
      - ./mocks:/app/mocks
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    volumes:
      - ./backend/src:/app/backend/src
      - ./shared:/app/shared
      - ./mocks:/app/mocks
      - ./contracts/abis:/app/contracts/abis:ro
      - ./contracts/deployments:/app/contracts/deployments
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - BEL_ENV=development
      - BEL_DEV_BOOTSTRAP=false
      - DATABASE_URL=postgresql://bel:bel@postgres:5432/bel
      - BEL_BLOCKCHAIN=evm
      - BEL_CHAIN_RPC_URL=http://evm-node:8545
      - BEL_CHAIN_DEPLOYMENT=local
      - BEL_CHAIN_ABI_DIR=contracts/abis
      - BEL_CHAIN_CONFIRMATIONS=1
      - BEL_CHAIN_DEV_SIGNER_KEYS=${BEL_CHAIN_DEV_SIGNER_KEYS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_started
      evm-deploy:
        condition: service_completed_successfully

  evm-node:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--chain-id"
      - "31337"
      - "--accounts"
      - "10"
      - "--balance"
      - "10000"
    ports:
      - "8545:8545"

  evm-deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["/bin/sh", "-c"]
    working_dir: /workspace/contracts
    volumes:
      - ./contracts:/workspace/contracts
    environment:
      BEL_BOOTSTRAP_ADMIN_WALLET: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      BEL_BOOTSTRAP_ADMIN_DID: "DID:BEL:ADMIN"
      BEL_NETWORK: local
    command:
      - >-
        until cast rpc --rpc-url http://evm-node:8545 eth_chainId >/dev/null 2>&1; do sleep 1; done;
        forge script script/Deploy.s.sol --rpc-url http://evm-node:8545 --broadcast --unlocked --sender 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 --cache-path /tmp/foundry-cache
    depends_on:
      - evm-node

  blockchain-node:
    build:
      context: .
      dockerfile: infra/docker/blockchain.Dockerfile
    volumes:
      - ./blockchain:/app/blockchain

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend

volumes:
  bel-postgres:
