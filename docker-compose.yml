services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bel
      POSTGRES_PASSWORD: bel
      POSTGRES_DB: bel
    ports:
      - "5432:5432"
    volumes:
      - bel-postgres:/var/lib/postgresql/data

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./shared:/app/shared
      - ./mocks:/app/mocks
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    volumes:
      - ./backend/src:/app/backend/src
      - ./shared:/app/shared
      - ./mocks:/app/mocks
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - BEL_ENV=development
      - BEL_DEV_BOOTSTRAP=true
      - DATABASE_URL=postgresql://bel:bel@postgres:5432/bel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - postgres

  blockchain-node:
    build:
      context: .
      dockerfile: infra/docker/blockchain.Dockerfile
    volumes:
      - ./blockchain:/app/blockchain

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend

volumes:
  bel-postgres:
