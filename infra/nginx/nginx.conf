# infra/nginx/nginx.conf
# Local reverse proxy: routes /api/* to the backend and everything else
# to the frontend dev server, so the app is reachable on a single port
# and CORS isn't a concern during local development.

events {}

http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://backend:4000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
